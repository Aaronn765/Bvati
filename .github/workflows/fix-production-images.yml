name: Fix production image visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-production-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve production poster visibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''        .prod-bg {
            position: absolute;
            inset: 0;
            opacity: 0.3;
            transition: opacity 0.4s, transform 0.6s;
        }

        .prod-item:hover .prod-bg {
            opacity: 0.6;
            transform: scale(1.1);
        }
'''

          new = '''        .prod-bg {
            position: absolute;
            inset: 0;
            opacity: 1;
            transition: transform 0.6s ease, filter 0.4s ease;
            filter: saturate(1.03) contrast(1.02);
        }

        .prod-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(3, 3, 3, 0.9) 0%, rgba(3, 3, 3, 0.28) 34%, transparent 62%);
            pointer-events: none;
            z-index: 1;
        }

        .prod-item > div:not(.prod-bg) {
            position: relative;
            z-index: 2;
        }

        .prod-item:hover .prod-bg {
            transform: scale(1.035);
            filter: saturate(1.08) contrast(1.04) brightness(1.04);
        }
'''

          if old not in text:
              raise SystemExit('Production image CSS block not found; aborting instead of modifying the wrong code.')
          text = text.replace(old, new, 1)

          old_mobile = '''            .prod-item {
                aspect-ratio: 3/4 !important;
            }
'''
          new_mobile = '''            .prod-item {
                aspect-ratio: 2/3 !important;
            }
'''
          if old_mobile not in text:
              raise SystemExit('Tablet production aspect-ratio block not found.')
          text = text.replace(old_mobile, new_mobile, 1)

          old_small = '''            .prod-item {
                aspect-ratio: 16/9 !important;
            }
'''
          new_small = '''            .prod-item {
                aspect-ratio: 2/3 !important;
                min-height: 0;
            }
'''
          if old_small not in text:
              raise SystemExit('Mobile production aspect-ratio block not found.')
          text = text.replace(old_small, new_small, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit fix
        run: |
          git rm .github/workflows/fix-production-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve production poster visibility"
          git push origin main
