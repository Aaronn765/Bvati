name: Fix production image visibility

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch poster CSS
        shell: bash
        run: |
          sed -i 's/opacity: 0.3;/opacity: 1;/' index.html
          sed -i 's/opacity: 0.6;/opacity: 1;/' index.html
          sed -i 's/aspect-ratio: 3\/4 !important;/aspect-ratio: 2\/3 !important;/' index.html
          sed -i 's/aspect-ratio: 16\/9 !important;/aspect-ratio: 2\/3 !important;/' index.html

          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); needle='        .prod-item:hover .prod-bg {\\n            opacity: 1;\\n            transform: scale(1.1);\\n        }\\n'; repl='        .prod-item::after {\\n            content: \\\'\\\';\\n            position: absolute;\\n            inset: 0;\\n            background: linear-gradient(to top, rgba(3, 3, 3, 0.88) 0%, rgba(3, 3, 3, 0.24) 34%, transparent 62%);\\n            pointer-events: none;\\n            z-index: 1;\\n        }\\n\\n        .prod-item > div:not(.prod-bg) {\\n            position: relative;\\n            z-index: 2;\\n        }\\n\\n        .prod-item:hover .prod-bg {\\n            opacity: 1;\\n            transform: scale(1.035);\\n        }\\n'; assert needle in s; p.write_text(s.replace(needle,repl,1))"

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve production poster visibility"
          git push origin main
